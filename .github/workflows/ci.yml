name: CI Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop, "feature/**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # UPDATED: Uses v4 (Node 20 safe)
      - name: Checkout Code
        uses: actions/checkout@v4

      # UPDATED: Uses v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven
        run: mvn clean package -B -V

      # UPDATED: Uses v4 (Fixes the deprecation error)
      - name: Upload MUnit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munit-test-reports
          path: |
            **/target/site/munit/coverage/
            **/target/surefire-reports/
